meta:
  name: light-brand.yml
  link: https://github.com/ozanozbeker/ozanozbeker.github.io/light-brand.yml

color:
  palette:
    gold: "#C0AC78"
    gold-dark: "#A1894B"
    white: "#FFFFFF"
    light-gray: "#767676"
    gray: "#494949"
    dark-gray: "#292929"
    black: "#0C0C0C"
    green: "#16302B"
    blue: "#124352"
    pink: "#804A5B"
    purple: "#492435"
  primary: gold-dark
  secondary: purple
  background: white
  foreground: dark-gray
  success: green
  info: blue
  warning: pink
  danger: purple
  light: white
  dark: black

typography:
  fonts:
    - family: JetBrains Mono
      source: google
      weight: [300, 400, 500, 600]
    - family: Inter
      source: google
      weight: [300, 400, 500, 600]
  headings:
    family: JetBrains Mono
    color: black
  base:
    family: Inter
    weight: 400
  monospace: JetBrains Mono
  monospace-inline:
    color: gold
    background-color: black
  monospace-block:
    background-color: black
  link:
    color: primary
    decoration: none

defaults:
  bootstrap:
    defaults:
      enable-rounded: true
    rules: |
      body {
        font-size: 0.9375rem;
        line-height: 1.625;
      }

      h1.title {
        color: $brand-gold-dark;
        font-weight: lighter;
        font-size: 2rem;
      }

      h2 { font-size: 1.5rem; }
      h3 { font-size: 1.25rem; }
      h4 { font-size: 1.125rem; }
      h5 { font-size: 1rem; }
      h6 { font-size: 1rem; }

      strong {
        color: black;
      }

      .sidebar,
      .sidebar a,
      .navbar,
      .navbar a {
        font-family: 'JetBrains Mono', monospace;
      }

      h4, h5, h6 {
        font-family: 'Inter', sans-serif;
      }

      h3 {
        margin-bottom: 0.25rem;
      }
